<div style="position:relative;width:640px">
  <video id="cam" autoplay playsinline muted width="640" height="480"></video>
  <canvas id="out" width="640" height="480"
          style="position:absolute;left:0;top:0"></canvas>
</div>
<p>Movement: <span id="score">0</span></p>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("cam");
const canvas = document.getElementById("out");
const ctx = canvas.getContext("2d");
const draw = new DrawingUtils(ctx);

video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });

const fileset = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
);
const pose = await PoseLandmarker.createFromOptions(fileset, {
  baseOptions: {
    modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
  },
  runningMode: "VIDEO"
});

let prev = null;
let total = 0;
const trail = []; // right wrist path (landmark 16)

function loop() {
  const result = pose.detectForVideo(video, performance.now());
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const lm = result.landmarks[0];

  if (lm) {
    // Skeleton
    draw.drawLandmarks(lm, { radius: 3 });
    draw.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS);

    // Movement amount = how far all points moved since last frame
    if (prev) {
      let d = 0;
      lm.forEach((p, i) => {
        d += Math.hypot(p.x - prev[i].x, p.y - prev[i].y);
      });
      total += d;
      document.getElementById("score").textContent = total.toFixed(1);
    }
    prev = lm.map(p => ({ x: p.x, y: p.y }));

    // Trail behind the right wrist
    trail.push({ x: lm[16].x * canvas.width, y: lm[16].y * canvas.height });
    if (trail.length > 60) trail.shift();
    ctx.beginPath();
    trail.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.strokeStyle = "cyan";
    ctx.lineWidth = 3;
    ctx.stroke();
  }
  requestAnimationFrame(loop);
}
video.addEventListener("loadeddata", loop);
</script>
